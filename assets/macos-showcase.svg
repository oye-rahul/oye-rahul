<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Laptop Screen -->
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="35%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#311042" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Aurora Waves -->
    <radialGradient id="auroraCyan" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraMagenta" cx="70%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>

    <!-- Dock Glass Gradient -->
    <linearGradient id="dockGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatMac {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes waveDrift {
        0%, 100% { transform: scale(1) translate(0px, 0px); }
        50% { transform: scale(1.1) translate(30px, -20px); }
      }
      @keyframes dockIconHover {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-6px) scale(1.15); }
      }
      @keyframes spotlightPulse {
        0%, 100% { stroke: #38bdf8; stroke-opacity: 0.8; box-shadow: 0 0 20px rgba(56,189,248,0.5); }
        50% { stroke: #c084fc; stroke-opacity: 1; }
      }
      @keyframes searchTyping {
        0%, 20% { clip-path: inset(0 100% 0 0); }
        60%, 85% { clip-path: inset(0 0 0 0); }
        95%, 100% { clip-path: inset(0 100% 0 0); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }

      .mac-body { animation: floatMac 7s ease-in-out infinite; }
      .aurora-layer { animation: waveDrift 10s ease-in-out infinite; }
      .icon-hover-1 { animation: dockIconHover 4s ease-in-out infinite; transform-origin: center; }
      .icon-hover-2 { animation: dockIconHover 4s ease-in-out 0.6s infinite; transform-origin: center; }
      .icon-hover-3 { animation: dockIconHover 4s ease-in-out 1.2s infinite; transform-origin: center; }
      .icon-hover-4 { animation: dockIconHover 4s ease-in-out 1.8s infinite; transform-origin: center; }
      .spotlight-border { animation: spotlightPulse 3s infinite; }
      .typing-search { animation: searchTyping 6s steps(35, end) infinite; }
      .pulse-item { animation: pulseGlow 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- SCREEN CHASSIS (ALUMINUM BEZEL) -->
  <g class="mac-body">
    <!-- Outer Bezel -->
    <rect x="25" y="10" width="800" height="400" rx="18" fill="#181c24" stroke="#334155" stroke-width="2" />
    <!-- Web Camera Notch / Dot -->
    <circle cx="425" cy="22" r="3.5" fill="#000000" stroke="#334155" stroke-width="1" />
    <circle cx="425" cy="22" r="1.5" fill="#0284c7" />

    <!-- SCREEN INNER DISPLAY AREA (776 x 366) -->
    <g transform="translate(37, 32)">
      <!-- Clip path for display screen -->
      <clipPath id="screenClip">
        <rect x="0" y="0" width="776" height="366" rx="8" />
      </clipPath>

      <g clip-path="url(#screenClip)">
        <!-- Screen Desktop Wallpaper -->
        <rect x="0" y="0" width="776" height="366" fill="url(#aurora)" />

        <!-- Aurora Glowing Mesh -->
        <g class="aurora-layer">
          <circle cx="200" cy="140" r="220" fill="url(#auroraCyan)" filter="url(#softGlow)" />
          <circle cx="580" cy="200" r="240" fill="url(#auroraMagenta)" filter="url(#softGlow)" />
        </g>

        <!-- TOP MACOS MENU BAR -->
        <rect x="0" y="0" width="776" height="26" fill="rgba(15, 23, 42, 0.65)" />
        <line x1="0" y1="26" x2="776" y2="26" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

        <!-- Left Menu Items -->
        <!-- Apple Logo -->
        <path d="M 18 13 C 18 10 19.5 8.5 21 8.5 C 20 10 20.5 12 21.8 12.5 C 22.5 12.8 23.5 12.5 24 11.5 C 24 14.5 22 17 20 17 C 19 17 18 15 18 13 Z" fill="#FFFFFF" opacity="0.9" />
        <text x="32" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700">DeskTab</text>
        <text x="88" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">File</text>
        <text x="120" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">Edit</text>
        <text x="152" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">View</text>
        <text x="190" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">Window</text>
        <text x="246" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">Help</text>

        <!-- Right Menu Items (WiFi, Battery, Control Center, Clock) -->
        <g transform="translate(620, 6)">
          <!-- WiFi Icon -->
          <path d="M 0 10 A 6 6 0 0 1 12 10 M 2 12 A 4 4 0 0 1 10 12 M 5 14 A 1 1 0 0 1 7 14" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.9" />
          <!-- Battery -->
          <rect x="22" y="3" width="18" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.9" />
          <rect x="24" y="5" width="13" height="6" rx="1" fill="#10B981" />
          <rect x="41" y="6" width="1.5" height="4" rx="0.5" fill="#ffffff" opacity="0.9" />
          <!-- Search / Spotlight -->
          <circle cx="56" cy="8" r="4" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.9" />
          <line x1="59" y1="11" x2="63" y2="15" stroke="#ffffff" stroke-width="1.2" opacity="0.9" />
          <!-- Clock -->
          <text x="74" y="11" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Wed 10:42 AM</text>
        </g>

        <!-- CENTER SPOTLIGHT SEARCH WINDOW -->
        <g transform="translate(138, 100)">
          <!-- Spotlight Backdrop Card -->
          <rect x="0" y="0" width="500" height="96" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="url(#auroraCyan)" stroke-width="1.5" class="spotlight-border" filter="url(#softGlow)" />
          
          <!-- Search Bar Top Input -->
          <g transform="translate(20, 18)">
            <!-- Search Icon -->
            <circle cx="12" cy="12" r="7" fill="none" stroke="#38BDF8" stroke-width="2" />
            <line x1="17" y1="17" x2="23" y2="23" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
            
            <!-- Input Text with Typing Animation -->
            <g transform="translate(36, 17)">
              <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600" class="typing-search">
                macOS-web • Pure Vanilla Web Operating System
              </text>
            </g>
          </g>

          <line x1="0" y1="52" x2="500" y2="52" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

          <!-- Spotlight Subtitle & Stats -->
          <g transform="translate(20, 76)">
            <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">
              ⚡ <tspan fill="#38BDF8" font-weight="600">0ms lag</tspan> &nbsp;•&nbsp; 
              🍏 <tspan fill="#A78BFA" font-weight="600">macOS Dock &amp; Widgets</tspan> &nbsp;•&nbsp; 
              🔒 <tspan fill="#34D399" font-weight="600">100% Client-Side Privacy</tspan>
            </text>
          </g>
        </g>

        <!-- WIDGET CARD (LEFT SIDE) -->
        <g transform="translate(30, 80)">
          <rect x="0" y="0" width="90" height="90" rx="16" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
          <text x="45" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" text-anchor="middle">☀️</text>
          <text x="45" y="56" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" text-anchor="middle">24°C</text>
          <text x="45" y="74" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Sunny</text>
        </g>

        <!-- WIDGET CARD (RIGHT SIDE) -->
        <g transform="translate(656, 80)">
          <rect x="0" y="0" width="90" height="90" rx="16" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
          <text x="45" y="32" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="middle">⚡</text>
          <text x="45" y="56" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" text-anchor="middle">60 FPS</text>
          <text x="45" y="74" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" text-anchor="middle">PERFECT</text>
        </g>

        <!-- FLOATING MACOS DOCK (BOTTOM) -->
        <g transform="translate(178, 280)">
          <!-- Glass Dock Background -->
          <rect x="0" y="0" width="420" height="66" rx="20" fill="url(#dockGlass)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2" filter="url(#softGlow)" />

          <!-- Dock Icons -->
          <!-- 1. Finder -->
          <g transform="translate(24, 11)" class="icon-hover-1">
            <rect x="0" y="0" width="44" height="44" rx="10" fill="#38BDF8" />
            <circle cx="16" cy="18" r="3" fill="#0369a1" />
            <circle cx="28" cy="18" r="3" fill="#0369a1" />
            <path d="M 15 28 Q 22 34 29 28" stroke="#0369a1" stroke-width="2.5" fill="none" stroke-linecap="round" />
            <circle cx="22" cy="49" r="2" fill="#ffffff" />
          </g>

          <!-- 2. Safari / Browser -->
          <g transform="translate(80, 11)" class="icon-hover-2">
            <rect x="0" y="0" width="44" height="44" rx="10" fill="#0284C7" />
            <circle cx="22" cy="22" r="14" fill="none" stroke="#ffffff" stroke-width="2" />
            <polygon points="22,10 26,22 18,22" fill="#EF4444" />
            <polygon points="22,34 26,22 18,22" fill="#E2E8F0" />
            <circle cx="22" cy="49" r="2" fill="#ffffff" />
          </g>

          <!-- 3. Terminal -->
          <g transform="translate(136, 11)" class="icon-hover-3">
            <rect x="0" y="0" width="44" height="44" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
            <text x="8" y="24" fill="#10B981" font-family="monospace" font-size="14" font-weight="900">&gt;_</text>
            <circle cx="22" cy="49" r="2" fill="#ffffff" />
          </g>

          <!-- 4. VS Code -->
          <g transform="translate(192, 11)" class="icon-hover-4">
            <rect x="0" y="0" width="44" height="44" rx="10" fill="#1E293B" stroke="#0ea5e9" stroke-width="1.2" />
            <path d="M 10 22 L 32 10 L 32 34 Z" fill="none" stroke="#38BDF8" stroke-width="2" />
            <path d="M 22 15 L 14 22 L 22 29" stroke="#60A5FA" stroke-width="2" fill="none" />
            <circle cx="22" cy="49" r="2" fill="#ffffff" />
          </g>

          <!-- 5. AI / Brain -->
          <g transform="translate(248, 11)" class="icon-hover-1">
            <rect x="0" y="0" width="44" height="44" rx="10" fill="#6366F1" />
            <text x="22" y="28" fill="#ffffff" font-family="sans-serif" font-size="18" text-anchor="middle">🧠</text>
            <circle cx="22" cy="49" r="2" fill="#ffffff" />
          </g>

          <!-- 6. Wallpapers & Settings -->
          <g transform="translate(304, 11)" class="icon-hover-2">
            <rect x="0" y="0" width="44" height="44" rx="10" fill="#475569" />
            <circle cx="22" cy="22" r="8" fill="none" stroke="#F1F5F9" stroke-width="4" stroke-dasharray="3 3" />
            <circle cx="22" cy="22" r="3" fill="#F1F5F9" />
            <circle cx="22" cy="49" r="2" fill="#ffffff" />
          </g>

          <!-- Separator Line -->
          <line x1="360" y1="12" x2="360" y2="52" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

          <!-- 7. Trash / App Launcher -->
          <g transform="translate(372, 11)" class="icon-hover-3">
            <rect x="0" y="0" width="36" height="44" rx="8" fill="#334155" opacity="0.8" />
            <text x="18" y="28" fill="#cbd5e1" font-size="16" text-anchor="middle">🚀</text>
          </g>
        </g>

      </g>
    </g>
  </g>

</svg>
