<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080b12" />
      <stop offset="100%" stop-color="#030408" />
    </linearGradient>

    <!-- Neon Horizon Glow -->
    <radialGradient id="horizonGlow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes pulseHorizon {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes floatCore {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .horizon-glow { transform-origin: 425px 120px; animation: pulseHorizon 4s ease-in-out infinite; }
      .core-float { animation: floatCore 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect x="0" y="0" width="850" height="180" fill="url(#footerBg)" rx="16" />

  <!-- PERSPECTIVE GRID (CYBERPUNK HORIZON) -->
  <g opacity="0.25" stroke="#38BDF8" stroke-width="1">
    <!-- Perspective Rays -->
    <line x1="425" y1="90" x2="0" y2="180" />
    <line x1="425" y1="90" x2="120" y2="180" />
    <line x1="425" y1="90" x2="240" y2="180" />
    <line x1="425" y1="90" x2="340" y2="180" />
    <line x1="425" y1="90" x2="510" y2="180" />
    <line x1="425" y1="90" x2="610" y2="180" />
    <line x1="425" y1="90" x2="730" y2="180" />
    <line x1="425" y1="90" x2="850" y2="180" />

    <!-- Horizontal Distance Lines -->
    <line x1="250" y1="100" x2="600" y2="100" />
    <line x1="180" y1="115" x2="670" y2="115" />
    <line x1="100" y1="135" x2="750" y2="135" />
    <line x1="0" y1="165" x2="850" y2="165" />
  </g>

  <!-- HORIZON GLOW -->
  <circle cx="425" cy="90" r="140" fill="url(#horizonGlow)" class="horizon-glow" />
  <line x1="50" y1="90" x2="800" y2="90" stroke="url(#neonLine)" stroke-width="1.8" />

  <!-- FLOATING POWER CORE (HEART / ATOM) -->
  <g transform="translate(425, 45)" class="core-float">
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#8B5CF6" stroke-width="1.5" />
    <circle cx="0" cy="0" r="8" fill="#00F0FF">
      <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOOTER TEXT -->
  <text x="425" y="125" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    Crafted with Precision &amp; Modern Motion by Rahul Malvi
  </text>

  <text x="425" y="148" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11.5" text-anchor="middle">
    Building the Future of Web Interfaces • Open Source Forever 🚀
  </text>

</svg>
