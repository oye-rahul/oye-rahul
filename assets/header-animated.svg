<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Animated Mesh Orbs Gradients -->
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="pinkOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.6" />
    </linearGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="textNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Laser Scan Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <!-- Styles & Animations -->
    <style>
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(60px, 30px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-50px, -25px) scale(1.2); }
      }
      @keyframes laserScan {
        0% { transform: translateY(-30px); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateY(330px); opacity: 0; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes type1 {
        0%, 30% { opacity: 1; }
        33%, 100% { opacity: 0; }
      }
      @keyframes type2 {
        0%, 32% { opacity: 0; }
        35%, 65% { opacity: 1; }
        68%, 100% { opacity: 0; }
      }
      @keyframes type3 {
        0%, 67% { opacity: 0; }
        70%, 97% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes pulseBadge {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes borderFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 800; }
      }

      .orb1 { animation: floatOrb1 8s ease-in-out infinite; }
      .orb2 { animation: floatOrb2 10s ease-in-out infinite; }
      .laser { animation: laserScan 4.5s ease-in-out infinite; }
      .cursor { animation: cursorBlink 0.9s infinite; }
      .line-1 { animation: type1 9s infinite; }
      .line-2 { animation: type2 9s infinite; }
      .line-3 { animation: type3 9s infinite; }
      .star-1 { animation: twinkle 3s ease-in-out infinite; }
      .star-2 { animation: twinkle 4s ease-in-out 1s infinite; }
      .star-3 { animation: twinkle 2.5s ease-in-out 0.5s infinite; }
      .animated-border {
        stroke-dasharray: 200 600;
        animation: borderFlow 12s linear infinite;
      }
    </style>
  </defs>

  <!-- MAIN CARD BACKGROUND -->
  <rect x="2" y="2" width="896" height="316" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- ANIMATED GLOWING ORBS (BEHIND CONTENT) -->
  <g filter="url(#orbBlur)">
    <circle cx="180" cy="120" r="140" fill="url(#cyanOrb)" class="orb1" />
    <circle cx="720" cy="180" r="160" fill="url(#purpleOrb)" class="orb2" />
    <circle cx="450" cy="240" r="110" fill="url(#pinkOrb)" class="orb1" />
  </g>

  <!-- CYBER GRID PATTERN -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="900" y2="60" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="180" x2="900" y2="180" />
    <line x1="0" y1="240" x2="900" y2="240" />
    <line x1="150" y1="0" x2="150" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="450" y1="0" x2="450" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="750" y1="0" x2="750" y2="320" />
  </g>

  <!-- TWINKLING STARS / PARTICLES -->
  <circle cx="120" cy="80" r="2" fill="#00F0FF" class="star-1" />
  <circle cx="820" cy="90" r="2.5" fill="#C084FC" class="star-2" />
  <circle cx="740" cy="270" r="1.5" fill="#38BDF8" class="star-3" />
  <circle cx="260" cy="280" r="2" fill="#818CF8" class="star-1" />
  <circle cx="560" cy="70" r="1.8" fill="#EC4899" class="star-2" />

  <!-- ANIMATED LASER SCANLINE -->
  <rect x="0" y="0" width="900" height="2" fill="url(#laserGrad)" class="laser" />

  <!-- BORDER GLOW TRACE -->
  <rect x="2" y="2" width="896" height="316" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" class="animated-border" />

  <!-- MACOS WINDOW HEADER -->
  <rect x="2" y="2" width="896" height="42" rx="20" fill="#0d1117" fill-opacity="0.6" />
  <!-- Smooth bottom cap for window header -->
  <rect x="2" y="24" width="896" height="20" fill="#0d1117" fill-opacity="0.6" />
  <line x1="2" y1="44" x2="898" y2="44" stroke="#1f293d" stroke-width="1" />

  <!-- macOS Window Control Dots -->
  <circle cx="30" cy="23" r="6" fill="#FF5F56" />
  <circle cx="50" cy="23" r="6" fill="#FFBD2E" />
  <circle cx="70" cy="23" r="6" fill="#27C93F" />

  <!-- Terminal Title Bar -->
  <text x="450" y="28" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">
    rahul@macos-web: ~/workspace (main)
  </text>

  <!-- Live Pulse Status Badge (Top Right) -->
  <g transform="translate(760, 14)">
    <rect x="0" y="0" width="112" height="20" rx="10" fill="#062822" stroke="#10B981" stroke-width="0.8" />
    <circle cx="12" cy="10" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="14" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10.5" font-weight="700" letter-spacing="0.5">ONLINE • LIVE</text>
  </g>

  <!-- GREETING & CODE PILL -->
  <g transform="translate(60, 85)">
    <rect x="0" y="0" width="135" height="26" rx="13" fill="#1e1e38" stroke="#3b82f6" stroke-width="1" />
    <text x="14" y="17" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="700">⚡ HELLO WORLD</text>
  </g>

  <!-- MAIN NAME - GLOWING GRADIENT -->
  <text x="60" y="165" fill="url(#textNeon)" filter="url(#neonGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="900" letter-spacing="-0.5">
    RAHUL MALVI
  </text>

  <!-- VERIFIED BADGE & HANDLE -->
  <g transform="translate(440, 130)">
    <rect x="0" y="0" width="145" height="28" rx="8" fill="#161b26" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="7" fill="#38BDF8" />
    <path d="M13 14 L15 16 L19 12" stroke="#000000" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="30" y="19" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="13" font-weight="700">@oye-rahul</text>
  </g>

  <!-- DYNAMIC CYCLING TYPEWRITER LINES -->
  <g transform="translate(60, 215)">
    <!-- Terminal Prompt Symbol -->
    <text x="0" y="0" fill="#00F0FF" font-family="'Fira Code', monospace" font-size="19" font-weight="700">&gt;</text>

    <!-- Line 1: UI Architect -->
    <text x="24" y="0" fill="#E2E8F0" font-family="'Fira Code', -apple-system, monospace" font-size="18" font-weight="500" class="line-1">
      Creative Frontend Engineer &amp; UI Architect
    </text>

    <!-- Line 2: macOS-web Creator -->
    <text x="24" y="0" fill="#38BDF8" font-family="'Fira Code', -apple-system, monospace" font-size="18" font-weight="500" class="line-2">
      Creator of macOS-web (DeskTab) — OS in Browser 💻
    </text>

    <!-- Line 3: Animations & Micro-Interactions -->
    <text x="24" y="0" fill="#A78BFA" font-family="'Fira Code', -apple-system, monospace" font-size="18" font-weight="500" class="line-3">
      Obsessed with Fluid 60fps Motion &amp; Glassmorphism ✨
    </text>

    <!-- Blinking Caret -->
    <rect x="525" y="-16" width="9" height="20" fill="#00F0FF" class="cursor" />
  </g>

  <!-- FEATURE TAGS PILLS (BOTTOM ROW) -->
  <g transform="translate(60, 260)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#0d1b2a" stroke="#00F0FF" stroke-width="0.8" />
    <text x="65" y="18" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">✦ Modern UI/UX</text>

    <!-- Tag 2 -->
    <rect x="142" y="0" width="135" height="28" rx="14" fill="#1b1233" stroke="#8B5CF6" stroke-width="0.8" />
    <text x="209" y="18" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">✦ Web OS Builder</text>

    <!-- Tag 3 -->
    <rect x="289" y="0" width="155" height="28" rx="14" fill="#0d251e" stroke="#10B981" stroke-width="0.8" />
    <text x="366" y="18" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">✦ Micro-Interactions</text>

    <!-- Tag 4 -->
    <rect x="456" y="0" width="150" height="28" rx="14" fill="#261b0a" stroke="#F59E0B" stroke-width="0.8" />
    <text x="531" y="18" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">✦ Pure Vanilla &amp; React</text>
  </g>

  <!-- FLOATING RIGHT LOGO/HOLOGRAM EMBLEM -->
  <g transform="translate(740, 140)">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="50" r="35" fill="none" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="8 4">
      <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="14s" repeatCount="indefinite" />
    </circle>
    <!-- Center Hologram Icon (Code brackets & Spark) -->
    <circle cx="50" cy="50" r="24" fill="#0f172a" stroke="#38BDF8" stroke-width="2" />
    <text x="50" y="56" fill="#38BDF8" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">&lt;/&gt;</text>
  </g>

</svg>
