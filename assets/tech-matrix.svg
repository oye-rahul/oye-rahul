<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" width="100%" height="100%">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#080b12" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Border Beam Gradients -->
    <linearGradient id="beam1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <linearGradient id="beam2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <linearGradient id="beam3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <linearGradient id="beam4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes beamTrail {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 600; }
      }
      @keyframes iconPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @keyframes tagGlow {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px currentColor); }
      }

      .beam-path-1 {
        stroke-dasharray: 80 400;
        animation: beamTrail 6s linear infinite;
      }
      .beam-path-2 {
        stroke-dasharray: 80 400;
        animation: beamTrail 7s linear infinite reverse;
      }
      .beam-path-3 {
        stroke-dasharray: 80 400;
        animation: beamTrail 8s linear infinite;
      }
      .beam-path-4 {
        stroke-dasharray: 80 400;
        animation: beamTrail 6.5s linear infinite reverse;
      }
      .card-item {
        transition: transform 0.2s ease;
      }
    </style>
  </defs>

  <!-- BENTO GRID (4 MODERN TILES) -->

  <!-- ================= TILE 1: LANGUAGES & FOUNDATIONS (Top Left) ================= -->
  <g transform="translate(10, 10)">
    <!-- Base -->
    <rect x="0" y="0" width="405" height="135" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />
    <!-- Animated Light Trail -->
    <rect x="0" y="0" width="405" height="135" rx="14" fill="none" stroke="url(#beam1)" stroke-width="2" class="beam-path-1" />

    <!-- Card Header -->
    <circle cx="28" cy="28" r="10" fill="#0369a1" fill-opacity="0.3" />
    <text x="28" y="32" fill="#38BDF8" font-size="12" font-weight="900" text-anchor="middle">&lt;/&gt;</text>
    <text x="46" y="32" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Core Languages &amp; Web</text>
    <text x="385" y="32" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">01</text>

    <!-- Tech Badges -->
    <g transform="translate(18, 52)">
      <!-- JavaScript -->
      <rect x="0" y="0" width="112" height="30" rx="7" fill="#1c1917" stroke="#F59E0B" stroke-width="0.8" />
      <text x="12" y="20" fill="#FBBF24" font-family="monospace" font-size="11.5" font-weight="700">JS</text>
      <text x="36" y="19" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">JavaScript</text>

      <!-- TypeScript -->
      <rect x="122" y="0" width="114" height="30" rx="7" fill="#0f172a" stroke="#3B82F6" stroke-width="0.8" />
      <text x="134" y="20" fill="#60A5FA" font-family="monospace" font-size="11.5" font-weight="700">TS</text>
      <text x="158" y="19" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">TypeScript</text>

      <!-- Python -->
      <rect x="246" y="0" width="90" height="30" rx="7" fill="#1e1e38" stroke="#818CF8" stroke-width="0.8" />
      <text x="258" y="20" fill="#A5B4FC" font-family="monospace" font-size="11.5" font-weight="700">PY</text>
      <text x="282" y="19" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Python</text>
    </g>

    <g transform="translate(18, 90)">
      <!-- HTML5 / CSS3 Modern -->
      <rect x="0" y="0" width="170" height="28" rx="6" fill="#161b26" stroke="#00F0FF" stroke-width="0.6" />
      <text x="14" y="18" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">HTML5 Semantic &amp; Canvas</text>

      <!-- Modern CSS3 & Motion -->
      <rect x="180" y="0" width="180" height="28" rx="6" fill="#161b26" stroke="#EC4899" stroke-width="0.6" />
      <text x="194" y="18" fill="#F472B6" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">CSS3 Grid, Flex &amp; Motion</text>
    </g>
  </g>

  <!-- ================= TILE 2: FRONTEND ARCHITECTURE (Top Right) ================= -->
  <g transform="translate(435, 10)">
    <!-- Base -->
    <rect x="0" y="0" width="405" height="135" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />
    <!-- Animated Light Trail -->
    <rect x="0" y="0" width="405" height="135" rx="14" fill="none" stroke="url(#beam2)" stroke-width="2" class="beam-path-2" />

    <!-- Card Header -->
    <circle cx="28" cy="28" r="10" fill="#581c87" fill-opacity="0.3" />
    <text x="28" y="32" fill="#C084FC" font-size="12" font-weight="900" text-anchor="middle">⚡</text>
    <text x="46" y="32" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Frontend &amp; UI Architecture</text>
    <text x="385" y="32" fill="#C084FC" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">02</text>

    <!-- Tech Badges -->
    <g transform="translate(18, 52)">
      <!-- React -->
      <rect x="0" y="0" width="86" height="30" rx="7" fill="#0c1929" stroke="#00F0FF" stroke-width="0.8" />
      <text x="12" y="19" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">⚛ React</text>

      <!-- Next.js -->
      <rect x="96" y="0" width="94" height="30" rx="7" fill="#18181b" stroke="#FFFFFF" stroke-width="0.8" />
      <text x="108" y="19" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">▲ Next.js</text>

      <!-- TailwindCSS -->
      <rect x="200" y="0" width="110" height="30" rx="7" fill="#082f49" stroke="#38BDF8" stroke-width="0.8" />
      <text x="212" y="19" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">TailwindCSS</text>

      <!-- Vite -->
      <rect x="320" y="0" width="55" height="30" rx="7" fill="#2e1065" stroke="#A855F7" stroke-width="0.8" />
      <text x="332" y="19" fill="#C084FC" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">⚡Vite</text>
    </g>

    <g transform="translate(18, 90)">
      <rect x="0" y="0" width="180" height="28" rx="6" fill="#1e1233" stroke="#8B5CF6" stroke-width="0.6" />
      <text x="12" y="18" fill="#C084FC" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">✨ Glassmorphism UI / UX</text>

      <rect x="190" y="0" width="170" height="28" rx="6" fill="#161b26" stroke="#38BDF8" stroke-width="0.6" />
      <text x="202" y="18" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">⚡ 60fps Micro-Animations</text>
    </g>
  </g>

  <!-- ================= TILE 3: BACKEND & ECOSYSTEM (Bottom Left) ================= -->
  <g transform="translate(10, 160)">
    <!-- Base -->
    <rect x="0" y="0" width="405" height="135" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />
    <!-- Animated Light Trail -->
    <rect x="0" y="0" width="405" height="135" rx="14" fill="none" stroke="url(#beam3)" stroke-width="2" class="beam-path-3" />

    <!-- Card Header -->
    <circle cx="28" cy="28" r="10" fill="#064e3b" fill-opacity="0.3" />
    <text x="28" y="32" fill="#34D399" font-size="12" font-weight="900" text-anchor="middle">⚙</text>
    <text x="46" y="32" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Backend, Runtime &amp; Storage</text>
    <text x="385" y="32" fill="#34D399" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">03</text>

    <!-- Tech Badges -->
    <g transform="translate(18, 52)">
      <!-- Node.js -->
      <rect x="0" y="0" width="94" height="30" rx="7" fill="#052e16" stroke="#22C55E" stroke-width="0.8" />
      <text x="12" y="19" fill="#4ADE80" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">Node.js</text>

      <!-- Express -->
      <rect x="104" y="0" width="86" height="30" rx="7" fill="#18181b" stroke="#71717A" stroke-width="0.8" />
      <text x="116" y="19" fill="#E4E4E7" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">Express</text>

      <!-- REST APIs -->
      <rect x="200" y="0" width="90" height="30" rx="7" fill="#082f49" stroke="#0EA5E9" stroke-width="0.8" />
      <text x="212" y="19" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">REST APIs</text>

      <!-- MongoDB -->
      <rect x="300" y="0" width="80" height="30" rx="7" fill="#064e3b" stroke="#10B981" stroke-width="0.8" />
      <text x="312" y="19" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">MongoDB</text>
    </g>

    <g transform="translate(18, 90)">
      <rect x="0" y="0" width="165" height="28" rx="6" fill="#052e25" stroke="#10B981" stroke-width="0.6" />
      <text x="12" y="18" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">🔒 LocalStorage &amp; IndexedDB</text>

      <rect x="175" y="0" width="180" height="28" rx="6" fill="#161b26" stroke="#00F0FF" stroke-width="0.6" />
      <text x="187" y="18" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">🌐 Web APIs &amp; Workers</text>
    </g>
  </g>

  <!-- ================= TILE 4: TOOLS & CREATIVE LAB (Bottom Right) ================= -->
  <g transform="translate(435, 160)">
    <!-- Base -->
    <rect x="0" y="0" width="405" height="135" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />
    <!-- Animated Light Trail -->
    <rect x="0" y="0" width="405" height="135" rx="14" fill="none" stroke="url(#beam4)" stroke-width="2" class="beam-path-4" />

    <!-- Card Header -->
    <circle cx="28" cy="28" r="10" fill="#78350f" fill-opacity="0.3" />
    <text x="28" y="32" fill="#FBBF24" font-size="12" font-weight="900" text-anchor="middle">🛠</text>
    <text x="46" y="32" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Tools, Workflows &amp; Prototyping</text>
    <text x="385" y="32" fill="#FBBF24" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">04</text>

    <!-- Tech Badges -->
    <g transform="translate(18, 52)">
      <!-- Git & GitHub -->
      <rect x="0" y="0" width="105" height="30" rx="7" fill="#1c1917" stroke="#F97316" stroke-width="0.8" />
      <text x="12" y="19" fill="#FB923C" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">Git / GitHub</text>

      <!-- Figma -->
      <rect x="115" y="0" width="85" height="30" rx="7" fill="#2e1065" stroke="#A855F7" stroke-width="0.8" />
      <text x="127" y="19" fill="#C084FC" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">🎨 Figma</text>

      <!-- VS Code -->
      <rect x="210" y="0" width="90" height="30" rx="7" fill="#082f49" stroke="#38BDF8" stroke-width="0.8" />
      <text x="222" y="19" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">VS Code</text>

      <!-- Extensions -->
      <rect x="310" y="0" width="75" height="30" rx="7" fill="#1e1b4b" stroke="#6366F1" stroke-width="0.8" />
      <text x="320" y="19" fill="#818CF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Chrome API</text>
    </g>

    <g transform="translate(18, 90)">
      <rect x="0" y="0" width="160" height="28" rx="6" fill="#18181b" stroke="#71717A" stroke-width="0.6" />
      <text x="12" y="18" fill="#E4E4E7" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">⚡ Vercel &amp; Cloud Deploys</text>

      <rect x="170" y="0" width="185" height="28" rx="6" fill="#281a06" stroke="#F59E0B" stroke-width="0.6" />
      <text x="182" y="18" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">🚀 Agile Prototyping &amp; UX</text>
    </g>
  </g>

</svg>
