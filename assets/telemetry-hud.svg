<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <!-- Fuel Gauge Gradient -->
    <linearGradient id="fuelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <style>
      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @keyframes gaugeFlow {
        0% { width: 40px; }
        50% { width: 190px; }
        100% { width: 175px; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .dot-live { animation: blinkDot 1.4s infinite; }
      .fuel-bar { animation: gaugeFlow 3s ease-out forwards; }
      .radar-line { transform-origin: 35px 35px; animation: radarSweep 4s linear infinite; }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect x="2" y="2" width="846" height="196" rx="14" fill="url(#hudBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- TOP HUD BAR -->
  <rect x="2" y="2" width="846" height="34" rx="14" fill="#0f172a" fill-opacity="0.8" />
  <rect x="2" y="22" width="846" height="14" fill="#0f172a" fill-opacity="0.8" />
  <line x1="2" y1="36" x2="848" y2="36" stroke="#334155" stroke-width="1" />

  <text x="24" y="23" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">SYS.TELEMETRY // RAHUL_MALVI_CORE_V2.6</text>
  <circle cx="810" cy="18" r="4" fill="#10B981" class="dot-live" />
  <text x="795" y="22" fill="#34D399" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">SYSTEMS NORMAL</text>

  <!-- COLUMN 1: RADAR & COFFEE METER -->
  <g transform="translate(24, 52)">
    <!-- Radar Circle -->
    <circle cx="35" cy="35" r="32" fill="#082f49" fill-opacity="0.2" stroke="#0284c7" stroke-width="1" />
    <circle cx="35" cy="35" r="20" fill="none" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="3 3" />
    <circle cx="35" cy="35" r="8" fill="none" stroke="#38bdf8" stroke-width="0.8" />
    <line x1="35" y1="35" x2="65" y2="35" stroke="#38BDF8" stroke-width="1.5" class="radar-line" />
    <circle cx="48" cy="24" r="2" fill="#10B981" class="dot-live" />

    <text x="82" y="22" fill="#94A3B8" font-family="monospace" font-size="11">COFFEE_RESERVE:</text>
    <text x="220" y="22" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">98.4% [OPTIMAL]</text>

    <!-- Gauge Track -->
    <rect x="82" y="30" width="190" height="12" rx="6" fill="#1e293b" />
    <rect x="82" y="30" width="175" height="12" rx="6" fill="url(#fuelGrad)" class="fuel-bar" />

    <text x="82" y="62" fill="#64748b" font-family="monospace" font-size="10.5">DEV_LOOP: CODE &gt; POLISH &gt; REPEAT</text>
  </g>

  <!-- VERTICAL DIVIDER 1 -->
  <line x1="320" y1="46" x2="320" y2="185" stroke="#1e293b" stroke-width="1" />

  <!-- COLUMN 2: CURRENT QUEST & METRICS -->
  <g transform="translate(340, 52)">
    <text x="0" y="16" fill="#A855F7" font-family="monospace" font-size="11" font-weight="700">&gt; ACTIVE_QUEST:</text>
    <text x="0" y="36" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Elevating macOS-web &amp; modern web OS tools</text>

    <text x="0" y="64" fill="#A855F7" font-family="monospace" font-size="11" font-weight="700">&gt; PERFORMANCE_TARGET:</text>
    <text x="0" y="84" fill="#34D399" font-family="monospace" font-size="12" font-weight="600">60 FPS Fluid UI • 0 Bloat • Pure Logic</text>

    <text x="0" y="112" fill="#A855F7" font-family="monospace" font-size="11" font-weight="700">&gt; COLLABORATION:</text>
    <text x="125" y="112" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">READY_FOR_ACTION</text>
  </g>

  <!-- VERTICAL DIVIDER 2 -->
  <line x1="620" y1="46" x2="620" y2="185" stroke="#1e293b" stroke-width="1" />

  <!-- COLUMN 3: TIMEZONE & CONTACT PILL -->
  <g transform="translate(640, 52)">
    <text x="0" y="16" fill="#64748b" font-family="monospace" font-size="11">BASE_STATION:</text>
    <text x="0" y="36" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">India 🇮🇳 (IST / UTC+5:30)</text>

    <text x="0" y="64" fill="#64748b" font-family="monospace" font-size="11">PING_RESPONSE:</text>
    <text x="0" y="84" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="600">&lt; 24 Hours via Email</text>

    <rect x="0" y="100" width="180" height="26" rx="6" fill="#1e1e38" stroke="#6366F1" stroke-width="0.8" />
    <text x="90" y="117" fill="#A5B4FC" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">✦ Ready to Build the Future</text>
  </g>

</svg>
