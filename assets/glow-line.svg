<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="6" viewBox="0 0 800 6" fill="none">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0" />
      <stop offset="25%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="75%" stop-color="#EC4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>
    <filter id="lineGlow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="2" width="800" height="2" fill="url(#lineGrad)" filter="url(#lineGlow)" rx="1" />
</svg>

